name: Repeated EXE and source audit
on:
  workflow_dispatch:
  push:
    branches: [audit-fixes-obs-search-gui-20261009]
    paths: ['tools/deep_audit.py', 'tools/function_index.py', '.github/workflows/deep-audit.yml']
permissions:
  contents: read
concurrency:
  group: deep-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prune-superseded:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel superseded runs of this audit on the same branch
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'deep-audit.yml', branch: context.ref.replace('refs/heads/', ''), per_page: 20});
            for (const run of runs.data.workflow_runs) {
              if (run.id < context.runId && ['queued', 'in_progress', 'waiting'].includes(run.status)) {
                try {
                  await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: run.id});
                } catch (error) { core.warning(`Cancellation skipped: ${error.message}`); }
              }
            }
  native-locale-probe:
    needs: prune-superseded
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original executable and native ANSI x86 source with scoped CP1251
        shell: pwsh
        run: |
          python tools/verify_exe.py release/AHK_FOR_GOS.exe
          python tools/deep_audit.py --probe --output "$env:RUNNER_TEMP/deep-probe"
          if ($LASTEXITCODE -ne 0) { throw 'Native locale probe failed; no full ANSI test claim' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-locale-probe
          path: ${{ runner.temp }}/deep-probe/*.json

  audit:
    needs: native-locale-probe
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        form: [exe, source]
        repeat: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repeat complete native x86 scenarios and isolated coverage
        shell: pwsh
        run: |
          python tools/deep_audit.py --form ${{ matrix.form }} --repeat ${{ matrix.repeat }} --output "$env:RUNNER_TEMP/deep-${{ matrix.form }}-${{ matrix.repeat }}"
          if ($LASTEXITCODE -ne 0) { throw 'Audit runner failed; inspect partial reports' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-${{ matrix.form }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/deep-${{ matrix.form }}-${{ matrix.repeat }}/*
          if-no-files-found: error
  publish-evidence:
    if: always()
    needs: [native-locale-probe, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/deep-results
      - name: Publish disposable audit reports to evidence branch
        shell: bash
        run: |
          set -euo pipefail
          branch=audit-evidence-20261022
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git switch -c "$branch" "origin/$branch"
          else
            git switch -c "$branch"
          fi
          target="audit-results/${{ github.run_id }}"
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/deep-results/." "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m "Native EXE/source audit evidence for run ${{ github.run_id }}"
          git push origin "HEAD:$branch"

name: Rights text GUI native x86 checks
on:
  workflow_dispatch:
  push:
    branches: [audit-fixes-obs-search-gui-20261009]
    paths: ['app/reference_guides.ahk', 'tests/reference_guides_regression.ahk', 'tools/rights_gui_audit.py', '.github/workflows/rights-gui.yml']
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check guide routing, current profile text, native windows and profile persistence
        shell: pwsh
        run: |
          python tools/rights_gui_audit.py --output "$env:RUNNER_TEMP/rights-gui"
          if ($LASTEXITCODE -ne 0) { throw 'Rights GUI checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rights-gui
          path: ${{ runner.temp }}/rights-gui/*
  evidence:
    needs: startup
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/startup-results
      - shell: bash
        run: |
          set -euo pipefail
          branch=audit-evidence-20261022
          git switch -c "$branch" "origin/$branch"
          target="audit-results/${{ github.run_id }}"
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/startup-results/." "$target/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$target"
          git commit -m "Native rights GUI evidence for run ${{ github.run_id }}"
          git push origin "HEAD:$branch"

name: Standalone Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [audit-fixes-obs-search-gui-20261009]
    paths: ['**/*.ahk', 'tools/**', 'laws/**', 'build.ps1', '.github/workflows/windows-exe.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify official ANSI x86 executable
        shell: pwsh
        run: |
          ./build.ps1
          python tools/verify_exe.py dist/AHK_FOR_GOS.exe
          python tools/verify_exe.py release/AHK_FOR_GOS.exe
          if ($LASTEXITCODE -ne 0) { throw 'Artifact verification failed' }
      - name: Native x86 boot and embedded-resource probe
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'ahk-gos-native-probe'
          $exe = (Resolve-Path 'release/AHK_FOR_GOS.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--runtime-info', '--data-dir', "`"$data`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Native boot failed: $($process.ExitCode)" }
          $report = Get-Content (Join-Path $data 'runtime_info_report.txt') -Raw
          $report
          foreach ($line in @('Compiled=1','PointerSize=4','Unicode=0','LawDocuments=20','SourceIntrospection=1')) {
            if (-not $report.Contains($line)) { throw "Missing native invariant: $line" }
          }
          if ($report.Contains('SystemCodepage=1251')) {
            $process = Start-Process -FilePath $exe -ArgumentList @('--audit-selftest', '--data-dir', "`"$data`"") -PassThru -Wait
            Get-Content (Join-Path $data 'audit_selftest_report.txt')
            if ($process.ExitCode -ne 0) { throw "Native regressions failed: $($process.ExitCode)" }
          } else {
            Write-Output 'SKIP full Cyrillic ANSI regressions: the hosted runner does not use system codepage 1251.'
          }
      - name: Native Windows GUI and sidebar compatibility (Unicode test host)
        shell: pwsh
        run: |
          python tools/build_exe.py --test-u64
          python tools/verify_exe.py dist/AHK_FOR_GOS_TEST_U64.exe --test-u64
          if ($LASTEXITCODE -ne 0) { throw 'Test host verification failed' }
          $data = Join-Path $env:RUNNER_TEMP 'ahk-gos-gui-probe'
          # The test host is Unicode; avoid CP1252 corrupting Russian INI metadata
          # on the English runner. Production ANSI/CP1251 compatibility is separate.
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          foreach ($name in @('profiles.ini','themes.ini','custom_functions.ini')) {
            [System.IO.File]::WriteAllText((Join-Path $data $name), "; Unicode native GUI fixture`r`n", [System.Text.Encoding]::Unicode)
          }
          $exe = (Resolve-Path 'dist/AHK_FOR_GOS_TEST_U64.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--desktop-smoke', '--data-dir', "`"$data`"") -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Native GUI check timed out' }
          $reportPath = Join-Path $data 'desktop_smoke_report.txt'
          $report = Get-Content $reportPath -Encoding utf8
          $report
          $failed = @($report | Where-Object { $_ -match '^FAIL' })
          foreach ($line in $failed) { Write-Output "::error title=Native GUI regression::$line" }
          $process.Refresh()
          if ($failed.Count -gt 0 -or $process.ExitCode -ne 0) { throw "Native GUI failed: $($process.ExitCode)" }
          Write-Output 'GUI tested in Unicode x64 host; game ABI, real input and OBS are not verified by this test.'
      - name: Previous law edition and custom overrides
        shell: pwsh
        run: |
          python tools/verify_laws.py
          python tools/check_law_upgrade.py dist/AHK_FOR_GOS_TEST_U64.exe --output .build/law_upgrade_report.txt
          if ($LASTEXITCODE -ne 0) { throw 'Law upgrade check failed' }
      - name: Native private TXT, character typing and paced menu input
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ahk-input-fixture/native.ahk'
          python tools/build_private_input_fixture.py $fixture
          $ahk = (Resolve-Path '.build/toolchain/1.1.37.02/AutoHotkeyU64.exe').Path
          $process = Start-Process -FilePath $ahk -ArgumentList @('/ErrorStdOut', "`"$fixture`"") -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Input fixture timed out' }
          $report = Get-Content (Join-Path (Split-Path $fixture) 'private_input_report.txt') -Encoding utf8
          $report
          $failed = @($report | Where-Object { $_ -match '^FAIL' })
          foreach ($line in $failed) { Write-Output "::error title=Native input regression::$line" }
          $process.Refresh()
          if ($failed.Count -gt 0 -or $process.ExitCode -ne 0) { throw "Native input failed: $($process.ExitCode)" }
          Write-Output 'Actual InputHook and key events; game predicate/action sink/decoration are explicit fixture seams.'
      - name: Faction typing routes paste and memory independently
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ahk-chat-route-fixture/native.ahk'
          python tools/build_chat_route_fixture.py $fixture
          $ahk = (Resolve-Path '.build/toolchain/1.1.37.02/AutoHotkeyU64.exe').Path
          $process = Start-Process -FilePath $ahk -ArgumentList @('/ErrorStdOut', "`"$fixture`"") -PassThru
          if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Chat route fixture timed out' }
          Get-Content (Join-Path (Split-Path $fixture) 'chat_route_report.txt') -Encoding utf8
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Chat routes failed: $($process.ExitCode)" }
      - name: Native chat commands, Alt+T and English aliases
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ahk-text-bind-fixture/native.ahk'
          $data = Join-Path $env:RUNNER_TEMP 'ahk-text-bind-data'
          python tools/build_text_bind_fixture.py $fixture
          $ahk = (Resolve-Path '.build/toolchain/1.1.37.02/AutoHotkeyU64.exe').Path
          $process = Start-Process -FilePath $ahk -ArgumentList @('/ErrorStdOut', "`"$fixture`"", '--data-dir', "`"$data`"") -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Text binding fixture timed out' }
          $report = Get-Content (Join-Path (Split-Path $fixture) 'text_bind_report.txt') -Encoding utf8
          $report
          foreach ($line in $report) {
            if ($line -match '^FAIL') { Write-Output "::error title=Native TXT binding regression::$line" }
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Native TXT bindings failed: $($process.ExitCode)" }
          Write-Output 'Actual application registration, Win32 edit, physical chord events and InputHook; game chat status and Capture API are explicit seams.'
      - name: Native GPS, menu ownership and cancellation
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ahk-game-menu-fixture/native.ahk'
          python tools/build_game_menu_fixture.py $fixture
          $ahk = (Resolve-Path '.build/toolchain/1.1.37.02/AutoHotkeyU64.exe').Path
          $process = Start-Process -FilePath $ahk -ArgumentList @('/ErrorStdOut', "`"$fixture`"") -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Game-menu fixture timed out' }
          $report = Get-Content (Join-Path (Split-Path $fixture) 'game_menu_report.txt') -Encoding utf8
          $report
          foreach ($line in $report) {
            if ($line -match '^FAIL') { Write-Output "::error title=Native game-menu probe::$line" }
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Native game-menu failed: $($process.ExitCode)" }
          Write-Output 'Real Win32 list/edit and key events; game process/chat state/memory sender are explicit seams.'
      - uses: actions/upload-artifact@v4
        with:
          name: AHK-FOR-GOS-Windows-ANSI-x86
          path: |
            dist/AHK_FOR_GOS.exe
            dist/AHK_FOR_GOS.sha256
            dist/AHK_FOR_GOS.build.json
          if-no-files-found: error
